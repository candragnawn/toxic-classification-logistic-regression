<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ToxicGuard - Dedicated Classifier</title>
    <meta name="description" content="AI models running toxic classification on your text 24/7">
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
</head>
<body>
    <nav class="navbar">
        <div class="logo">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <rect x="3" y="3" width="18" height="18" rx="4" fill="currentColor"/>
                <path d="M8 12L11 15L16 9" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <span>ToxicGuard</span>
        </div>
    </nav>

    <main class="hero">
        <div class="hero-content">
            <h1>A dedicated classifier<br>for every comment</h1>
            <p>AI models running toxic classification on your text 24/7</p>
            <button id="demoBtn" class="cta-btn">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
                Try Classification
            </button>
        </div>

        <div class="wave-container">
            <div class="gradient-bg">
                <div class="blob blob-1"></div>
                <div class="blob blob-2"></div>
                <div class="blob blob-3"></div>
                <div class="blob blob-4"></div>
                <div class="blob blob-5"></div>
            </div>
            
            <svg class="wave-mask" viewBox="0 0 1440 320" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none">
                
                <path fill="#FCFCFC" d="M0,0 L1440,0 L1440,160 C1140,260 840,40 540,180 C240,320 120,100 0,160 Z"></path>
                
                <path fill="#FCFCFC" d="M0,320 L1440,320 L1440,180 C1140,280 840,60 540,200 C240,340 120,120 0,180 Z"></path>
            </svg>
        </div>

        <div class="partners">
            <div class="partner-logo">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/></svg>
                <span>Python</span>
            </div>
            <div class="partner-logo">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12h4l3-9 5 18 3-9h5"/></svg>
                <span>Scikit-Learn</span>
            </div>
            <div class="partner-logo">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="2" ry="2"/><rect x="9" y="9" width="6" height="6"/></svg>
                <span>Pandas</span>
            </div>
            <div class="partner-logo">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></svg>
                <span>NumPy</span>
            </div>
        </div>
    </main>

    
    <div id="demoModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" id="closeBtn">&times;</span>
            <h2>Test Toxicity Model</h2>
            <p>Enter text below to simulate toxic classification.</p>
            <textarea id="textInput" rows="5" placeholder="Type something here..."></textarea>
            <button id="classifyBtn" class="cta-btn" style="width: 100%; justify-content: center;">Classify Text</button>
            <div id="resultBox" class="result-box hidden">
                <h4>Result:</h4>
                <div class="progress-bar-container">
                    <span style="width: 80px;">Toxic:</span>
                    <div class="progress-bar"><div class="progress" id="toxicProgress" style="width: 0%; background: #ff4757;"></div></div>
                    <span id="toxicValue" style="width: 40px; text-align: right;">0%</span>
                </div>
                <div class="progress-bar-container">
                    <span style="width: 80px;">Non-Toxic:</span>
                    <div class="progress-bar"><div class="progress" id="nontoxicProgress" style="width: 0%; background: #2ed573;"></div></div>
                    <span id="nontoxicValue" style="width: 40px; text-align: right;">0%</span>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
